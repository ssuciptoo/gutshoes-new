name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, dom, exif, fileinfo, gd, intl, mbstring, pdo_sqlite, pdo_mysql, pcntl, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Audit dependencies
        run: composer audit --no-interaction --locked

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test --compact

      - name: Check formatting
        run: composer run format:check

      - name: Run PHPStan
        run: composer run analyse

  storefront:
    name: Storefront checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build staging bundle
        run: npm run build:staging
        env:
          VITE_API_URL: https://api-ci.invalid/api/v1
          VITE_SITE_URL: https://ci.invalid
          # Kunci publishable tiruan (host clerk.ci.invalid): build hanya memeriksa format, tidak menghubungi Clerk.
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuY2kuaW52YWxpZCQ

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, storefront]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --file apps/backend/Dockerfile --tag gutshoes-backend:ci apps/backend

      - name: Build storefront image
        run: docker build --file apps/storefront/Dockerfile --tag gutshoes-storefront:ci --build-arg VITE_API_URL=https://api-ci.invalid/api/v1 --build-arg VITE_SITE_URL=https://ci.invalid --build-arg VITE_CLERK_PUBLISHABLE_KEY=pk_test_Y2xlcmsuY2kuaW52YWxpZCQ --build-arg VITE_BUILD_MODE=staging apps/storefront

      - name: Check storefront image placeholders
        run: |
          # Placeholder nginx (__API_ORIGIN__, __CLERK_FAPI__, ...) harus sudah terisi saat build.
          if docker run --rm gutshoes-storefront:ci grep -q '__[A-Z_]*__' /etc/nginx/conf.d/default.conf /etc/nginx/snippets/security-headers.conf; then
            echo "Placeholder nginx belum terisi:" && docker run --rm gutshoes-storefront:ci grep -n '__[A-Z_]*__' /etc/nginx/conf.d/default.conf /etc/nginx/snippets/security-headers.conf
            exit 1
          fi
          docker run --rm gutshoes-storefront:ci grep -q 'https://clerk.ci.invalid' /etc/nginx/snippets/security-headers.conf
