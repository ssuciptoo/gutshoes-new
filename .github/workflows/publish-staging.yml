name: Publish staging images

# Dibangun hanya setelah workflow CI sukses untuk push ke main, sehingga VPS staging (yang terlalu
# kecil untuk build sendiri) cukup menarik image jadi dari GHCR.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-staging
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: staging
    env:
      # Isi di Settings > Environments > staging > Variables (bukan Secrets: nilainya publik di bundle).
      STAGING_DOMAIN: ${{ vars.STAGING_DOMAIN }}
      STAGING_CLERK_PUBLISHABLE_KEY: ${{ vars.STAGING_CLERK_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image names
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "backend=ghcr.io/${owner}/gutshoes-backend" >> "$GITHUB_OUTPUT"
          echo "storefront=ghcr.io/${owner}/gutshoes-storefront" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        run: |
          docker build --file apps/backend/Dockerfile \
            --tag "${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.sha }}" \
            --tag "${{ steps.meta.outputs.backend }}:staging" apps/backend
          docker push --all-tags "${{ steps.meta.outputs.backend }}"

      # Nilai VITE_* masuk ke bundle saat build, jadi storefront baru bisa dibangun setelah domain
      # dan instance Clerk staging ada.
      - name: Build and push storefront
        if: env.STAGING_DOMAIN != '' && env.STAGING_CLERK_PUBLISHABLE_KEY != ''
        run: |
          docker build --file apps/storefront/Dockerfile \
            --build-arg VITE_BUILD_MODE=staging \
            --build-arg "VITE_API_URL=https://api-staging.${STAGING_DOMAIN}/api/v1" \
            --build-arg "VITE_SITE_URL=https://staging.${STAGING_DOMAIN}" \
            --build-arg "VITE_CLERK_PUBLISHABLE_KEY=${STAGING_CLERK_PUBLISHABLE_KEY}" \
            --tag "${{ steps.meta.outputs.storefront }}:${{ steps.meta.outputs.sha }}" \
            --tag "${{ steps.meta.outputs.storefront }}:staging" apps/storefront
          docker push --all-tags "${{ steps.meta.outputs.storefront }}"

      - name: Storefront skipped
        if: env.STAGING_DOMAIN == '' || env.STAGING_CLERK_PUBLISHABLE_KEY == ''
        run: echo "::warning::Storefront tidak dibangun. Isi variable STAGING_DOMAIN dan STAGING_CLERK_PUBLISHABLE_KEY di environment 'staging'."

      - name: Summary
        run: |
          {
            echo "### Image staging"
            echo "- \`${{ steps.meta.outputs.backend }}:${{ steps.meta.outputs.sha }}\`"
            echo "- Tag \`staging\` menunjuk ke commit \`${{ steps.meta.outputs.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
