# Included in every location: nginx drops server-level add_header once a location sets its own.
# The bundle has no inline or third-party scripts; the API origin and product images are
# HTTPS hosts chosen at build time, so connect/img allow https: rather than one fixed host.
# Clerk memuat skripnya saat runtime dari Frontend API instance (__CLERK_FAPI__, diisi Dockerfile dari
# publishable key) plus Cloudflare/Clerk bot protection; lihat panduan CSP Clerk.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://__CLERK_FAPI__ https://challenges.cloudflare.com https://*.protect.clerk.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: https://*.protect.clerk.com:*; worker-src 'self' blob:; frame-src 'self' https://challenges.cloudflare.com https://*.protect.clerk.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Browser mengabaikan HSTS di HTTP biasa, jadi aman meski nginx ini listen di port 80 di belakang
# terminator TLS: header baru berlaku saat sampai ke pengunjung lewat HTTPS. Sengaja tanpa
# includeSubDomains/preload agar subdomain lain yang belum HTTPS tidak ikut terkunci.
add_header Strict-Transport-Security "max-age=31536000" always;
