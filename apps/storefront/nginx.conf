server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Vite emits content-hashed file names under /assets, so they can be cached forever.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Halaman produk: index.html yang sama, tetapi tag <head> (judul, deskripsi, Open Graph, JSON-LD)
    # diisi data produk lewat SSI agar pratinjau WhatsApp/Facebook dan Google tidak perlu JavaScript.
    # Slug di luar pola ini tetap dilayani location / tanpa SSI.
    location ~ ^/product/(?<seo_slug>[A-Za-z0-9._-]+)/?$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        ssi on;
        ssi_silent_errors on;
        try_files /index.html =404;
    }

    # Hanya untuk subrequest SSI di atas; tidak bisa dibuka langsung dari luar.
    location ^~ /__seo/ {
        internal;
        proxy_pass __API_ORIGIN__/api/v1/seo/;
        proxy_ssl_server_name on;
        # Cookie/token pengunjung tidak ikut dikirim ke backend.
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host __API_HOST__;
        proxy_set_header Accept "text/html";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        # Respons gagal (4xx/5xx/timeout) diganti body kosong → SSI memakai blok default_head.
        proxy_intercept_errors on;
        error_page 400 401 403 404 429 500 502 503 504 = @seo_fallback;
    }

    location @seo_fallback {
        return 204;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        # index.html must revalidate so a deploy is picked up immediately.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # sitemap.xml dibuat backend dari produk yang dipublikasikan; disajikan dari domain toko
    # karena mesin pencari mengharapkan sitemap di domain yang sama. __API_ORIGIN__ diisi saat build image.
    location = /sitemap.xml {
        proxy_pass __API_ORIGIN__/api/v1/sitemap.xml;
        proxy_ssl_server_name on;
        proxy_set_header Host __API_HOST__;
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 'ok';
    }
}
